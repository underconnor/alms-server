name: Secret scan
on: [push, pull_request]
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download pinned Gitleaks and verify checksum
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan complete Git history
        run: >-
          "$RUNNER_TEMP/gitleaks" git .
          --log-opts="--all" --max-archive-depth=2 --redact=100
          --no-banner --no-color
      - name: Extract and scan bundled SDK contents
        run: |
          mkdir "$RUNNER_TEMP/alms-sdk-scan"
          tar -xzf vendor/alms-ssu-api-0.3.39.tgz -C "$RUNNER_TEMP/alms-sdk-scan"
          "$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/alms-sdk-scan" --redact=100 --no-banner --no-color
